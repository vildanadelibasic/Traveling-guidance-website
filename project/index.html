<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/aboutUsPage.js"></script>
    <title>Travel Guidance</title>
  </head>
  <body>
   
    <nav class="navbar navbar-expand-sm" id="navBar">
      <div class="container-fluid">
        <a href="#" id="landingLink"><img src="pictures/logo.png" class="logo" alt="Logo" /></a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mynavbar">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mynavbar">
          <ul class="navbar-nav me-auto">
            <li class="nav-item">
              <a class="nav-link" href="#" id="planningLink">Planning</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#" id="destinationLink">Destinations</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#" id="aboutUsLink">About Us</a>
            </li>
            <li class="nav-item dropdown">
              <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">My gallery</a>
              <ul class="dropdown-menu">
                <li><a class="dropdown-item" href="#" id="istanbulLink">Istanbul</a></li>
                <li><a class="dropdown-item" href="#" id="hercegNoviLink">Herceg Novi</a></li>
                <li><a class="dropdown-item" href="#" id="parisLink">Paris</a></li>
              </ul>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#" id="questionsLink">Questions</a>
            </li>
            <li class="nav-item">
              <button class="btn btn-secondary" id="darkModeBtn" type="button">Dark Mode</button>
            </li>
          </ul>
          <form class="d-flex">
            <input class="form-control me-2" id="search" type="text" placeholder="Search" />
            <button class="btn btn-primary" id="buttonSearch" type="button">Search</button>
            <button class="btn btn-primary" id="registerBtn" type="button" onclick="document.getElementById('modalToggle').checked = true;">Registruj se</button>
            <input type="checkbox" class="modal-toggle" id="modalToggle" />
            <div class="modal">
              <div class="modal-content">
                <span class="close-btn" onclick="document.getElementById('modalToggle').checked = false;">&times;</span>
                <h2>Registracija</h2>
                <form>
                  <label for="username">Korisničko ime:</label>
                  <input type="text" id="username" name="username" required />

                  <label for="email">Email:</label>
                  <input type="email" id="email" name="email" required />

                  <label for="password">Lozinka:</label>
                  <input type="password" id="password" name="password" required />

                  <button type="submit">Registruj se</button>
                </form>
              </div>
            </div>
          </form>
        </div>
      </div>
    </nav>

 
    <div id="main-content">
  
    </div>

  
    <footer class="footer">
      <div class="info">
        <p>NAME AND SURNAME</p>
        <p style="font-weight: bold">Vildana Delibašić</p>
        <p>DEPARTMENT</p>
        <p style="font-weight: bold">IT Department</p>
      </div>
      <div class="copyright">
        <p class="copyrightText">©2024 Copyright: vildana.delibasic</p>
      </div>
    </footer>

    <script src="app.js"></script>
    <script src="js/planningPage.js"></script>
    <script src="js/istanbulPage.js"></script>
    <script src="js/questionPage.js"></script>
  </body>
</html>
