          </button>
          <div class="collapse navbar-collapse" id="mynavbar">
            <ul class="navbar-nav me-auto">
              <li class="nav-item">

              </li>
              <li class="nav-item">

                <a class="nav-link" href="../aboutUsPage/aboutUsPage.html">About Us</a>

            <form class="d-flex">
              <input class="form-control me-2" id="search" type="text" placeholder="Search">

              <button class="btn btn-primary" id="registerBtn" type="button" onclick="document.getElementById('modalToggle').checked = true;">Registruj se</button>

        </div>

    <div class="main">
        <img class="image" src="../pictures/landing.jpg" alt="background-image">

            <div class="text-block">
                <h4>Where to next?</h4>
                <p>Plan your trip</p>
            </div>
        </a>

    <input type="checkbox" class="modal-toggle" id="modalToggle">
    <div class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="document.getElementById('modalToggle').checked = false;">&times;</span>
            <h2>Registracija</h2>
            <form>
                <label for="username">Korisničko ime:</label>
                <input type="text" id="username" name="username" required>
                
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
                
                <label for="password">Lozinka:</label>
                <input type="password" id="password" name="password" required>
                
                <button type="submit">Registruj se</button>
            </form>
        </div>
    </div>
