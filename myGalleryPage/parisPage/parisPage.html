        <div class="collapse navbar-collapse" id="mynavbar">
          <ul class="navbar-nav me-auto">
            <li class="nav-item">
              <a class="nav-link" href="../../planningPage/planningPage.html">Planning</a>

            <li class="nav-item">

            <li class="nav-item">

              <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">My gallery</a>
              <ul class="dropdown-menu">
                <li>
                  <a class="dropdown-item" href="../istanbulPage/istanbulPage.html">Istanbul</a>

              <button class="btn btn-secondary" id="darkModeBtn" type="button">Dark Mode</button>
            </li>
          </ul>
          <form class="d-flex">
            <input class="form-control me-2" id="search" type="text" placeholder="Search" />
            <button class="btn btn-primary" id="buttonSearch" type="button">Search</button>
            <button class="btn btn-primary" id="registerBtn" type="button" onclick="document.getElementById('modalToggle').checked = true;">Registruj se</button>
            <input type="checkbox" class="modal-toggle" id="modalToggle" />
            <div class="modal">
              <div class="modal-content">
                <span class="close-btn" onclick="document.getElementById('modalToggle').checked = false;">&times;</span>
                <h2>Registracija</h2>
                <form>
                  <label for="username">Korisničko ime:</label>
                  <input type="text" id="username" name="username" required />

                  <label for="email">Email:</label>
                  <input type="email" id="email" name="email" required />

                  <label for="password">Lozinka:</label>
                  <input type="password" id="password" name="password" required />

                  <button type="submit">Registruj se</button>
                </form>
              </div>
            </div>
          </form>
        </div>
      </div>
    </nav>

    <div class="image-background">
      <div id="carouselExampleControls" class="carousel slide" data-bs-ride="carousel">
        <div class="carousel-inner">
          <div class="carousel-item active">
            <img src="../../pictures/pariz1.png" class="d-block w-100 img-bordered" alt="Pariz 1" />
          </div>
          <div class="carousel-item">
            <img src="../../pictures/pariz2.png" class="d-block w-100 img-bordered" alt="Pariz 2" />
          </div>
          <div class="carousel-item">
            <img src="../../pictures/pariz3.png" class="d-block w-100 img-bordered" alt="Pariz 3" />
          </div>
        </div>
        <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleControls" data-bs-slide="prev">
          <span class="carousel-control-prev-icon" aria-hidden="true"></span>
          <span class="visually-hidden">Previous</span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleControls" data-bs-slide="next">
          <span class="carousel-control-next-icon" aria-hidden="true"></span>
          <span class="visually-hidden">Next</span>
        </button>
